<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CATC LabTrack</title>
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
  <main>
    <section aria-labelledby="title">
      <p class="brand">CAT College <span>/</span> LabTrack</p>
      <h1 id="title">Sign in</h1>
      <p>Access the laboratory equipment register.</p>
      <p th:if="${param.error}" class="error" role="alert">Username or password is incorrect. Try again.</p>
      <p th:if="${param.logout}" class="notice" role="status">You’re signed out.</p>
      <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
