<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Equipment register · CATC LabTrack</title>
  <link rel="stylesheet" href="/css/register.css">
  <script src="/js/register.js" defer></script>
</head>
<body>
  <header><strong>CATC LabTrack</strong><span>Custodian workspace</span>
    <form th:action="@{/logout}" method="post"><button type="submit">Sign out</button></form>
  </header>
  <main>
    <h1>Equipment register</h1>
    <section th:replace="~{shared/equipment :: catalog(true)}"></section>
    <section th:replace="~{shared/equipment :: create}"></section>
    <section>
      <h2>Reservations</h2>
      <p th:if="${#lists.isEmpty(reservations)}">No reservations yet.</p>
      <article th:each="r : ${reservations}">
        <h3 th:text="${r.reference() + ' · ' + r.equipmentName()}"></h3>
        <p th:text="${r.borrowerName() + ' · ' + r.quantity() + ' unit(s) · ' + r.useDate() + ' · ' + r.status()}"></p>
        <form th:each="action : ${r.status().name() == 'PENDING' ? {'BORROWED','CANCELLED'} : (r.status().name() == 'BORROWED' ? {'RETURNED'} : {})}"
              class="equipment-action" data-method="PUT"
              th:attr="data-url=@{/api/reservations/{id}/status/{next}(id=${r.id()},next=${action})}">
          <button th:text="${action == 'BORROWED' ? 'Confirm pickup' : (action == 'RETURNED' ? 'Record return' : 'Cancel reservation')}"></button>
          <output role="status"></output>
        </form>
      </article>
    </section>
  </main>
</body>
</html>
