<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="catalog(canDelete)">
  <form method="get" class="filter">
    <label>Lab location<input name="location" th:value="${location}" placeholder="e.g. Electrical Engineering"></label>
    <button>Search</button>
  </form>
  <div class="scroll"><table>
    <caption>Equipment by asset code</caption>
    <thead><tr><th>Asset code</th><th>Equipment</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="item : ${items}">
        <td th:text="${item.assetCode()}"></td><td th:text="${item.name()}"></td>
        <td th:text="${item.location()}"></td><td th:text="${item.status()}"></td>
        <td>
          <details><summary>Edit</summary>
            <form class="equipment-action" data-method="PUT" th:attr="data-url=@{/api/equipment/{id}(id=${item.id()})}">
              <label>Asset code<input required name="assetCode" maxlength="32" th:value="${item.assetCode()}"></label>
              <label>Equipment name<input required name="name" maxlength="80" th:value="${item.name()}"></label>
              <label>Lab location<input required name="location" maxlength="80" th:value="${item.location()}"></label>
              <label>Status<select name="status">
                <option th:each="state : ${T(ph.edu.catc.labtrack.equipment.model.Status).values()}" th:text="${state}" th:selected="${state == item.status()}"></option>
              </select></label>
              <button>Save changes</button><output role="status"></output>
            </form>
          </details>
          <form th:if="${canDelete}" class="equipment-action" data-method="DELETE"
                th:attr="data-url=@{/api/equipment/{id}(id=${item.id()})},data-code=${item.assetCode()}">
            <button>Delete</button><output role="status"></output>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(items)}"><td colspan="5">No equipment matches this location.</td></tr>
    </tbody>
  </table></div>
</section>
<section th:fragment="create">
  <details><summary>Register a new item</summary>
    <form id="create-form" class="equipment-action" data-method="POST" data-url="/api/equipment" th:attr="data-header=${_csrf.headerName},data-token=${_csrf.token}">
      <label>Asset code<input required name="assetCode" maxlength="32" pattern="[A-Za-z0-9\-]+" placeholder="EE-002"></label>
      <label>Equipment name<input required name="name" maxlength="80"></label>
      <label>Lab location<input required name="location" maxlength="80"></label>
      <label>Current status<select name="status"><option>AVAILABLE</option><option>RESERVED</option><option>BORROWED</option></select></label>
      <button>Save equipment</button><output role="status"></output>
    </form>
  </details>
</section>
</body></html>
