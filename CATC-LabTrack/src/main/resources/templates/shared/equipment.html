<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>

<section th:fragment="catalog(canDelete)" class="card">
    <div class="card-head"><h2>Equipment list</h2></div>
    <div class="toolbar">
        <form method="get" class="filters">
            <label class="field">
                <span>Lab location</span>
                <input name="location" th:value="${location}" placeholder="e.g. Electrical Engineering">
            </label>
            <button class="btn btn-secondary">Search</button>
        </form>
    </div>
    <div class="scroll"><table>
        <caption class="sr-only">Equipment by asset code</caption>
        <thead><tr><th>Asset code</th><th>Equipment</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td data-label="Asset code"><span class="code" th:text="${item.assetCode()}"></span></td>
            <td data-label="Equipment">
                <div class="equip">
                    <img th:if="${item.imageUrl() != null}" th:src="${item.imageUrl()}" alt="" width="64" height="64" loading="lazy">
                    <div>
                        <strong th:text="${item.name()}"></strong>
                        <span th:text="${item.description()}"></span>
                    </div>
                </div>
            </td>
            <td data-label="Location" th:text="${item.location()}"></td>
            <td data-label="Status">
                <span th:class="${'badge badge-' + item.status().name().toLowerCase()}" th:text="${item.status()}"></span>
                <small class="units" th:text="${item.availableUnits() + ' of ' + item.totalUnits() + ' free'}"></small>
            </td>
        <td><details><summary>Edit</summary>
            <form class="equipment-action" data-method="PUT" th:attr="data-url=@{/api/equipment/{id}(id=${item.id()})}">
              <label>Asset code<input required name="assetCode" maxlength="32" th:value="${item.assetCode()}"></label>
              <label>Equipment name<input required name="name" maxlength="80" th:value="${item.name()}"></label>
              <label>Lab location<input required name="location" maxlength="80" th:value="${item.location()}"></label>
              <label>Status<select name="status">
                <option th:each="state : ${T(ph.edu.catc.labtrack.equipment.model.Status).values()}" th:text="${state}" th:selected="${state == item.status()}"></option>
              </select></label>
              <button>Save changes</button><output role="status"></output>
            </form>
          </details>
          <form th:if="${canDelete}" class="equipment-action" data-method="DELETE"
                th:attr="data-url=@{/api/equipment/{id}(id=${item.id()})},data-code=${item.assetCode()}">
            <button>Delete</button><output role="status"></output>
          </form>
        </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}" class="empty"><td colspan="5">No equipment matches this location.</td></tr>
        </tbody>
    </table></div>
</section>

<section th:fragment="create" class="card">
    <details><summary>Register a new item</summary>
        <form id="create-form" class="grid-form form-pad equipment-action" data-method="POST" data-url="/api/equipment" th:attr="data-header=${_csrf.headerName},data-token=${_csrf.token}">
            <label class="field"><span>Asset code</span><input required name="assetCode" maxlength="32" pattern="[A-Za-z0-9\-]+" placeholder="CATC-mlt002DM"></label>
            <label class="field"><span>Equipment name</span><input required name="name" maxlength="80"></label>
            <label class="field"><span>Short description</span><input name="description" maxlength="255" placeholder="What it is used for"></label>
            <label class="field"><span>Lab location</span><input required name="location" maxlength="80" placeholder="Engineering Laboratory 1 | Room 302"></label>
            <label class="field"><span>Units in stock</span><input name="totalUnits" type="number" min="1" max="99" value="1"></label>
            <label class="field"><span>Current status</span><select name="status"><option>AVAILABLE</option><option>RESERVED</option><option>BORROWED</option></select></label>
            <div class="form-actions"><button class="btn btn-primary">Save equipment</button><output role="status"></output></div>
        </form>
    </details>
</section>

</body></html>
